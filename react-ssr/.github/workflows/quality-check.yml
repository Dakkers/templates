name: quality check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: quality-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Format check
        run: pnpm fmt:check

      - name: Lint check
        run: pnpm lint:check

      - name: Typecheck
        run: pnpm typecheck

  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [development, staging, production]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Build (${{ matrix.mode }})
        run: pnpm build --mode ${{ matrix.mode }}

  smoke-test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [development, staging, production]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      # The suite builds in this mode and boots a preview server itself (see
      # tests/smoke/globalSetup.ts), so this is the same single command you run
      # locally — no CI-only server plumbing to keep in sync.
      - name: Smoke test (${{ matrix.mode }})
        run: pnpm test:smoke
        env:
          SMOKE_MODE: ${{ matrix.mode }}
